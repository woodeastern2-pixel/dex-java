plugins {
    id 'com.android.application'
}

def demoAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'
def demoAdmobBannerId = 'ca-app-pub-3940256099942544/9214589741'
def demoAdmobRewardedInterstitialId = 'ca-app-pub-3940256099942544/5354046379'
// AdMob app/ad unit IDs are public SDK identifiers, not account credentials.
def productionAdmobAppId = 'ca-app-pub-9360550840761530~2858347564'
def productionAdmobBannerId = 'ca-app-pub-9360550840761530/1545265891'
def productionAdmobRewardedInterstitialId = 'ca-app-pub-9360550840761530/9533285758'
def releaseAdmobAppId = project.findProperty('ADMOB_APP_ID') ?: productionAdmobAppId
def releaseAdmobBannerId = project.findProperty('ADMOB_BANNER_ID') ?: productionAdmobBannerId
def releaseAdmobRewardedInterstitialId = project.findProperty('ADMOB_REWARDED_INTERSTITIAL_ID') ?: productionAdmobRewardedInterstitialId

base {
    archivesName = "이름온"
}

android {
    namespace 'com.easternwood.ireumgil'
    compileSdk 36

    defaultConfig {
        applicationId "com.easternwood.ireumgil"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            resValue "string", "admob_app_id", demoAdmobAppId
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${demoAdmobBannerId}\""
            buildConfigField "String", "ADMOB_REWARDED_INTERSTITIAL_ID", "\"${demoAdmobRewardedInterstitialId}\""
            buildConfigField "boolean", "USING_TEST_ADS", "true"
        }
        release {
            resValue "string", "admob_app_id", releaseAdmobAppId
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${releaseAdmobBannerId}\""
            buildConfigField "String", "ADMOB_REWARDED_INTERSTITIAL_ID", "\"${releaseAdmobRewardedInterstitialId}\""
            buildConfigField "boolean", "USING_TEST_ADS", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'cn.6tail:lunar:1.7.7'
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
    testImplementation 'junit:junit:4.13.2'
}
