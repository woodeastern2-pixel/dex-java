plugins {
    id 'com.android.application'
}

def readSetting = { String name ->
    def value = project.findProperty(name) ?: System.getenv(name)
    value == null ? '' : value.toString().trim()
}

def testAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'
def testAdmobBannerId = 'ca-app-pub-3940256099942544/9214589741'
def testAdmobRewardedInterstitialId = 'ca-app-pub-3940256099942544/5354046379'
def configuredAdmobAppId = readSetting('ADMOB_APP_ID')
def configuredAdmobBannerId = readSetting('ADMOB_BANNER_ID')
def configuredAdmobRewardedInterstitialId = readSetting('ADMOB_REWARDED_INTERSTITIAL_ID')
def productionAdsConfigured = configuredAdmobAppId ==~ /ca-app-pub-\d{16}~\d+/
        && configuredAdmobBannerId ==~ /ca-app-pub-\d{16}\/\d+/
        && configuredAdmobRewardedInterstitialId ==~ /ca-app-pub-\d{16}\/\d+/
        && configuredAdmobAppId != testAdmobAppId
        && configuredAdmobBannerId != testAdmobBannerId
        && configuredAdmobRewardedInterstitialId != testAdmobRewardedInterstitialId
def admobAppId = productionAdsConfigured ? configuredAdmobAppId : testAdmobAppId
def admobBannerId = productionAdsConfigured ? configuredAdmobBannerId : testAdmobBannerId
def admobRewardedInterstitialId = productionAdsConfigured ? configuredAdmobRewardedInterstitialId : testAdmobRewardedInterstitialId
def allowTestAdsForRelease = readSetting('ALLOW_TEST_ADS').equalsIgnoreCase('true')

def releaseKeystorePath = readSetting('WHEREISIT_KEYSTORE_PATH')
def releaseKeystorePassword = readSetting('WHEREISIT_KEYSTORE_PASSWORD')
def releaseKeyAlias = readSetting('WHEREISIT_KEY_ALIAS')
def releaseKeyPassword = readSetting('WHEREISIT_KEY_PASSWORD')
def releaseSigningConfigured = !releaseKeystorePath.isEmpty()
        && !releaseKeystorePassword.isEmpty()
        && !releaseKeyAlias.isEmpty()
        && !releaseKeyPassword.isEmpty()

base {
    archivesName = "WhereIsIt"
}

android {
    namespace 'com.whereisit.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.easternwood.whereisit"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        resValue "string", "admob_app_id", admobAppId
        buildConfigField "String", "ADMOB_BANNER_ID", "\"${admobBannerId}\""
        buildConfigField "String", "ADMOB_REWARDED_INTERSTITIAL_ID", "\"${admobRewardedInterstitialId}\""
        buildConfigField "boolean", "ADS_USING_TEST_IDS", productionAdsConfigured ? "false" : "true"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            create("release") {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.getByName("release")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.9.2'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    testImplementation 'junit:junit:4.13.2'
}

tasks.register("verifyProductionReadiness") {
    group = "verification"
    description = "Verifies production AdMob IDs and Play upload signing configuration."
    doLast {
        if (!productionAdsConfigured) {
            throw new GradleException("Production AdMob properties are required: ADMOB_APP_ID, ADMOB_BANNER_ID, ADMOB_REWARDED_INTERSTITIAL_ID")
        }
        if (!releaseSigningConfigured || !file(releaseKeystorePath).isFile()) {
            throw new GradleException("Play upload signing properties and a valid WHEREISIT_KEYSTORE_PATH are required")
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseArtifactRequested = taskGraph.allTasks.any { task ->
        task.project == project && task.name in ["assembleRelease", "bundleRelease", "lintRelease"]
    }
    if (releaseArtifactRequested && !productionAdsConfigured && !allowTestAdsForRelease) {
        throw new GradleException("Release tasks cannot use Google test ad IDs. Supply production AdMob IDs or explicitly pass -PALLOW_TEST_ADS=true for a QA-only artifact.")
    }
}
