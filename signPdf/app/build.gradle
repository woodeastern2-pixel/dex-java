plugins {
    id 'com.android.application'
}

def envOrProperty = { String name ->
    def envValue = System.getenv(name)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    def propertyValue = project.findProperty(name)
    return propertyValue == null ? null : propertyValue.toString()
}

def demoAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'
def demoAdmobBannerId = 'ca-app-pub-3940256099942544/9214589741'
def demoAdmobRewardedInterstitialId = 'ca-app-pub-3940256099942544/5354046379'
// AdMob app/ad unit IDs are public SDK identifiers, not account credentials.
def productionAdmobAppId = 'ca-app-pub-9360550840761530~4729882760'
def productionAdmobBannerId = 'ca-app-pub-9360550840761530/3512169860'
def productionAdmobRewardedInterstitialId = 'ca-app-pub-9360550840761530/1728314908'
def configuredAdmobAppId = envOrProperty('ADMOB_APP_ID')
def configuredAdmobBannerId = envOrProperty('ADMOB_BANNER_ID')
def configuredAdmobRewardedInterstitialId = envOrProperty('ADMOB_REWARDED_INTERSTITIAL_ID')
def releaseAdmobAppId = configuredAdmobAppId ?: productionAdmobAppId
def releaseAdmobBannerId = configuredAdmobBannerId ?: productionAdmobBannerId
def releaseAdmobRewardedInterstitialId =
    configuredAdmobRewardedInterstitialId ?: productionAdmobRewardedInterstitialId

def releaseStoreFile = envOrProperty('SIGNPDF_KEYSTORE_FILE')
def releaseStorePassword = envOrProperty('SIGNPDF_KEYSTORE_PASSWORD')
def releaseKeyAlias = envOrProperty('SIGNPDF_KEY_ALIAS')
def releaseKeyPassword = envOrProperty('SIGNPDF_KEY_PASSWORD')
def releaseSigningReady = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

base {
    archivesName = "SignPDF"
}

android {
    namespace 'com.signpdf.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.easternwood.signpdf"
        minSdk 24
        targetSdk 36
        versionCode 24
        versionName "1.9.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            resValue "string", "admob_app_id", demoAdmobAppId
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${demoAdmobBannerId}\""
            buildConfigField "String", "ADMOB_REWARDED_INTERSTITIAL_ID", "\"${demoAdmobRewardedInterstitialId}\""
            buildConfigField "boolean", "USING_TEST_ADS", "true"
        }
        release {
            resValue "string", "admob_app_id", releaseAdmobAppId
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${releaseAdmobBannerId}\""
            buildConfigField "String", "ADMOB_REWARDED_INTERSTITIAL_ID", "\"${releaseAdmobRewardedInterstitialId}\""
            buildConfigField "boolean", "USING_TEST_ADS", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    testImplementation 'junit:junit:4.13.2'
}
