name: DolbomOn v0.4.8 Final Store Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'dolbomon/**'
      - '.github/workflows/dolbomon-v047-final.yml'
  push:
    branches: [ 'feature/dolbomon-v034-exact-redesign' ]
    paths:
      - 'dolbomon/**'
      - '.github/workflows/dolbomon-v047-final.yml'

concurrency:
  group: dolbomon-v048-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore v0.4.8 source
        run: bash dolbomon/ci/restore-v048.sh "$RUNNER_TEMP/dolbomon-src"

      - name: Prepare final visual and share regression source
        run: |
          python3 dolbomon/ci/visual-seed-v041.py "$RUNNER_TEMP/dolbomon-src"
          python3 dolbomon/ci/prepare-v046-user-flow.py "$RUNNER_TEMP/dolbomon-src"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'dolbomon-src/app/src/main/AndroidManifest.xml'
          s=p.read_text()
          s=s.replace('android:name=".MessageCenterActivity" android:exported="false"', 'android:name=".MessageCenterActivity" android:exported="true"')
          p.write_text(s)
          PY

      - name: Build debug and share-test APKs
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API35 final share regression and screen capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash dolbomon/ci/run-v048-final-capture.sh "$RUNNER_TEMP/dolbomon-src"

      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.4.8-final-screens
          path: v048-final-screens
          retention-days: 7
