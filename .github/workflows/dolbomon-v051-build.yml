name: Build DolbomOn v0.5.1

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'dolbomon/**'
      - 'privacy/dolbomon.md'
      - '.github/workflows/dolbomon-v051-build.yml'
  push:
    branches: [ 'feature/dolbomon-*' ]
    paths:
      - 'dolbomon/**'
      - 'privacy/dolbomon.md'
      - '.github/workflows/dolbomon-v051-build.yml'

concurrency:
  group: dolbomon-v051-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore v0.5.1 source
        run: bash dolbomon/ci/restore-v051.sh "$RUNNER_TEMP/dolbomon-src"

      - name: Add API35 basic-record regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('${{ runner.temp }}/dolbomon-src/app/build.gradle')
          s=p.read_text()
          marker="    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'"
          deps="\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n    androidTestImplementation 'androidx.test:core:1.6.1'\n    androidTestImplementation 'androidx.test:runner:1.6.2'"
          if 'androidx.test.ext:junit' not in s:
              s=s.replace(marker, marker+deps)
          p.write_text(s)
          PY
          TESTDIR="$RUNNER_TEMP/dolbomon-src/app/src/androidTest/java/com/easternwood/dolbomon"
          mkdir -p "$TESTDIR"
          cat > "$TESTDIR/RecordSelectionDeviceTest.java" <<'JAVA'
          package com.easternwood.dolbomon;
          import static org.junit.Assert.*;
          import android.content.*;
          import android.view.View;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import androidx.test.core.app.ActivityScenario;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import androidx.test.platform.app.InstrumentationRegistry;
          import com.google.android.material.button.MaterialButton;
          import com.google.android.material.chip.*;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import java.lang.reflect.Field;

          @RunWith(AndroidJUnit4.class)
          public class RecordSelectionDeviceTest {
            @Test public void dailySelectionsAreIndependentScrollableAndStepTransitionStable() throws Exception {
              Context c=InstrumentationRegistry.getInstrumentation().getTargetContext();
              c.deleteDatabase("dolbomon.db");
              Field sf=DatabaseHelper.class.getDeclaredField("instance"); sf.setAccessible(true); sf.set(null,null);
              DatabaseHelper db=DatabaseHelper.get(c);
              long id=db.addSenior("홍길동","89","9","남성");
              assertEquals(1L,id);
              try(ActivityScenario<RecordActivity> sc=ActivityScenario.launch(new Intent(c,RecordActivity.class).putExtra("senior_id",id).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))) {
                sc.onActivity(a->{ try {
                  ChipGroup schedule=g(a,"mealGroup"), interaction=g(a,"waterGroup"), support=g(a,"conditionGroup");
                  assertTrue(schedule.getParent() instanceof HorizontalScrollView);
                  assertFalse(((HorizontalScrollView)schedule.getParent()).isHorizontalScrollBarEnabled());
                  Chip s1=(Chip)schedule.getChildAt(1), s2=(Chip)schedule.getChildAt(2), i=(Chip)interaction.getChildAt(0);
                  s1.performClick(); i.performClick(); assertTrue(s1.isChecked()); assertTrue(i.isChecked());
                  s2.performClick(); assertFalse(s1.isChecked()); assertTrue(s2.isChecked()); assertTrue(i.isChecked());
                  ((Chip)support.getChildAt(0)).performClick(); click(a,"moodGroup",1); click(a,"sleepGroup",0); click(a,"bowelGroup",0);
                  ((MaterialButton)get(a,"bottomAction")).performClick();
                  assertFalse(a.isFinishing()); assertFalse(a.isDestroyed());
                  assertEquals(2,((Integer)get(a,"currentStep")).intValue());
                  assertEquals(View.VISIBLE,((LinearLayout)get(a,"step2Container")).getVisibility());
                } catch(Exception e){ throw new RuntimeException(e); }});
                Thread.sleep(700);
                sc.onActivity(a->assertFalse(a.isFinishing()));
              }
            }
            static ChipGroup g(Object a,String n)throws Exception{return(ChipGroup)get(a,n);}
            static void click(Object a,String n,int i)throws Exception{((Chip)g(a,n).getChildAt(i)).performClick();}
            static Object get(Object o,String n)throws Exception{Field f=o.getClass().getDeclaredField(n);f.setAccessible(true);return f.get(o);}
          }
          JAVA

      - name: Build debug and instrumentation APKs
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API35 daily-record regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            gradle -p "$RUNNER_TEMP/dolbomon-src" :app:connectedDebugAndroidTest
            if adb logcat -d | grep -E 'FATAL EXCEPTION|Process: com.easternwood.dolbomon'; then exit 1; fi

      - name: Lint release
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:lintRelease

      - name: Build release AAB
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:bundleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/dolbomon-src/app/build/outputs/apk/debug/DolbomOn-debug.apk" out/DolbomOn-v0.5.1-debug.apk
          cp "$RUNNER_TEMP/dolbomon-src/app/build/outputs/bundle/release/DolbomOn-release.aab" out/DolbomOn-v0.5.1-release-unsigned.aab
          base64 -d "$RUNNER_TEMP/dolbomon-src/app/icon-source.b64" > out/DolbomOn-icon-512.png

      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.5.1-debug-apk
          path: out/DolbomOn-v0.5.1-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.5.1-release-unsigned-aab
          path: out/DolbomOn-v0.5.1-release-unsigned.aab
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-play-icon-v0.5.1
          path: out/DolbomOn-icon-512.png
          retention-days: 7
