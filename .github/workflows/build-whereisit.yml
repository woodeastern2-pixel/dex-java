name: Build WhereIsIt

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'whereIsIt/**'
      - '.github/workflows/build-whereisit.yml'
  push:
    branches:
      - main
      - 'feature/whereisit-*'
    paths:
      - 'whereIsIt/**'
      - '.github/workflows/build-whereisit.yml'

concurrency:
  group: whereisit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-whereisit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p whereIsIt :app:assembleDebug

      - name: Build release AAB
        run: gradle -p whereIsIt :app:bundleRelease

      - name: Lint release
        run: gradle -p whereIsIt :app:lintRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.1.0-debug-apk
          path: whereIsIt/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.1.0-release-aab
          path: whereIsIt/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
