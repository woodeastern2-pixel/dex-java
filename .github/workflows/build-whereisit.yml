name: Build WhereIsIt

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'whereIsIt/**'
      - '.github/workflows/build-whereisit.yml'
  push:
    branches:
      - main
      - 'feature/whereisit-*'
    paths:
      - 'whereIsIt/**'
      - '.github/workflows/build-whereisit.yml'

concurrency:
  group: whereisit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-whereisit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Test gentle ad policy
        run: gradle -p whereIsIt :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p whereIsIt :app:assembleDebug

      - name: Build QA release AAB with Google test ads
        run: gradle -p whereIsIt :app:bundleRelease -PALLOW_TEST_ADS=true

      - name: Lint QA release
        run: gradle -p whereIsIt :app:lintRelease -PALLOW_TEST_ADS=true

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.2.0-qa-debug-apk
          path: whereIsIt/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload QA release AAB
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.2.0-qa-test-ads-aab
          path: whereIsIt/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Play upload key
        env:
          WHEREISIT_KEYSTORE_BASE64: ${{ secrets.WHEREISIT_KEYSTORE_BASE64 }}
          WHEREISIT_KEYSTORE_PASSWORD: ${{ secrets.WHEREISIT_KEYSTORE_PASSWORD }}
          WHEREISIT_KEY_ALIAS: ${{ secrets.WHEREISIT_KEY_ALIAS }}
          WHEREISIT_KEY_PASSWORD: ${{ secrets.WHEREISIT_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$WHEREISIT_KEYSTORE_BASE64"
          test -n "$WHEREISIT_KEYSTORE_PASSWORD"
          test -n "$WHEREISIT_KEY_ALIAS"
          test -n "$WHEREISIT_KEY_PASSWORD"
          printf '%s' "$WHEREISIT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whereisit-upload.jks"
          echo "WHEREISIT_KEYSTORE_PATH=$RUNNER_TEMP/whereisit-upload.jks" >> "$GITHUB_ENV"
          echo "WHEREISIT_KEYSTORE_PASSWORD=$WHEREISIT_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "WHEREISIT_KEY_ALIAS=$WHEREISIT_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "WHEREISIT_KEY_PASSWORD=$WHEREISIT_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify production configuration
        env:
          ADMOB_APP_ID: ${{ secrets.WHEREISIT_ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.WHEREISIT_ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.WHEREISIT_ADMOB_INTERSTITIAL_ID }}
        run: gradle -p whereIsIt :app:verifyProductionReadiness

      - name: Build signed production AAB
        env:
          ADMOB_APP_ID: ${{ secrets.WHEREISIT_ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.WHEREISIT_ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.WHEREISIT_ADMOB_INTERSTITIAL_ID }}
        run: gradle -p whereIsIt :app:bundleRelease :app:lintRelease

      - name: Upload signed production AAB
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.2.0-production-aab
          path: whereIsIt/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
