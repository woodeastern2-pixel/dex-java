name: Build WhereIsIt

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'whereIsIt/**'
      - '.github/workflows/build-whereisit.yml'
  push:
    branches:
      - main
      - 'feature/whereisit-*'
    paths:
      - 'whereIsIt/**'
      - '.github/workflows/build-whereisit.yml'

concurrency:
  group: whereisit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-whereisit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Test gentle ad policy
        run: gradle -p whereIsIt :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p whereIsIt :app:assembleDebug

      - name: Build QA release AAB with Google test ads
        run: gradle -p whereIsIt :app:bundleRelease -PALLOW_TEST_ADS=true

      - name: Lint release
        run: gradle -p whereIsIt :app:lintRelease -PALLOW_TEST_ADS=true

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.2.0-qa-debug-apk
          path: whereIsIt/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.2.0-qa-test-ads-aab
          path: whereIsIt/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
