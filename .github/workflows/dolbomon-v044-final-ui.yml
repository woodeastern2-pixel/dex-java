name: DolbomOn v0.4.4 Final UI Check

on:
  workflow_dispatch:
  push:
    branches: [ 'feature/dolbomon-v034-exact-redesign' ]
    paths: [ '.github/workflows/dolbomon-v044-final-ui.yml' ]

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore and seed v0.4.4
        run: |
          bash dolbomon/ci/restore-v044.sh "$RUNNER_TEMP/dolbomon-src"
          python3 dolbomon/ci/visual-seed-v041.py "$RUNNER_TEMP/dolbomon-src"
      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API35 final UI screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/dolbomon-src/app/build/outputs/apk/debug/DolbomOn-debug.apk"
            adb shell pm clear com.easternwood.dolbomon >/dev/null
            mkdir -p v044-final-ui
            adb shell am start -W -n com.easternwood.dolbomon/.MainActivity --ez visual_seed true >/dev/null
            sleep 4
            adb exec-out screencap -p > v044-final-ui/01-home.png
            adb shell am force-stop com.easternwood.dolbomon
            adb shell am start -W -n com.easternwood.dolbomon/.SeniorActivity --el senior_id 4 >/dev/null
            sleep 3
            adb exec-out screencap -p > v044-final-ui/02-detail.png
            adb shell uiautomator dump /sdcard/detail.xml >/dev/null
            adb pull /sdcard/detail.xml v044-final-ui/detail.xml >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DolbomOn-v0.4.4-final-ui-screens
          path: v044-final-ui
          if-no-files-found: warn
          retention-days: 7
