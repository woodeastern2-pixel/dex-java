name: Export DolbomOn Source

on:
  push:
    branches:
      - 'feature/dolbomon-commercial-redesign'
    paths:
      - '.github/workflows/export-dolbomon-source.yml'
      - 'dolbomon/**'
  workflow_dispatch:

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          rm -rf "$RUNNER_TEMP/dolbomon-src"
          mkdir -p "$RUNNER_TEMP/dolbomon-src"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$RUNNER_TEMP/dolbomon-src"
          tar -czf "$RUNNER_TEMP/DolbomOn-restored-source.tar.gz" -C "$RUNNER_TEMP/dolbomon-src" .
      - name: Upload restored source
        uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-restored-source
          path: ${{ runner.temp }}/DolbomOn-restored-source.tar.gz
          retention-days: 1
