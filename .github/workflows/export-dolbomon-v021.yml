name: Export DolbomOn v0.2.1 Source

on:
  push:
    branches:
      - 'feature/dolbomon-v022-korean-records'
    paths:
      - '.github/workflows/export-dolbomon-v021.yml'
  workflow_dispatch:

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v0.2.1 source
        run: |
          rm -rf "$RUNNER_TEMP/dolbomon-src"
          mkdir -p "$RUNNER_TEMP/dolbomon-src"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$RUNNER_TEMP/dolbomon-src"
          cat dolbomon/patches/v0.2.0-commercial.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/dolbomon-commercial.patch"
          cat dolbomon/patches/v0.2.1-settings.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/dolbomon-v021.patch"
          cd "$RUNNER_TEMP/dolbomon-src"
          patch -p2 < "$RUNNER_TEMP/dolbomon-commercial.patch"
          patch -p3 < "$RUNNER_TEMP/dolbomon-v021.patch"
          tar -czf "$RUNNER_TEMP/DolbomOn-v0.2.1-source.tar.gz" -C "$RUNNER_TEMP/dolbomon-src" .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.2.1-source
          path: ${{ runner.temp }}/DolbomOn-v0.2.1-source.tar.gz
          retention-days: 1
