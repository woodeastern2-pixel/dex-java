name: DolbomOn v0.4.1 Final Design Validation

on:
  workflow_dispatch:
  push:
    branches: [ 'feature/dolbomon-v034-exact-redesign' ]
    paths:
      - 'dolbomon/patches/v0.4.1-final-design.patch.gz.b64'
      - '.github/workflows/dolbomon-v041-final.yml'

concurrency:
  group: dolbomon-v041-final-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: ${{ runner.temp }}/dolbomon-src

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore v0.4.1 source
        run: |
          SRC="$APP_DIR"
          rm -rf "$SRC" && mkdir -p "$SRC"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$SRC"
          echo 'android.sourceset.disallowProvider=false' >> "$SRC/gradle.properties"
          for spec in \
            'v0.2.0-commercial:p2' \
            'v0.2.1-settings:p3' \
            'v0.2.2-korean-records:p2' \
            'v0.2.3-ui-fixes:p2' \
            'v0.3.0-redesign:p1' \
            'v0.3.1b-final-ui:p1' \
            'v0.3.2-record-ux:p1'; do
            name=${spec%%:*}; strip=${spec##*:}
            cat dolbomon/patches/${name}.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/${name}.patch"
            (cd "$SRC" && patch -${strip} < "$RUNNER_TEMP/${name}.patch")
          done
          cat dolbomon/patches/v0.3.3-stability-ui.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v033.patch" && (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033.patch")
          base64 -d dolbomon/patches/v0.3.3-scrollbar-crashfix.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v033s.patch" && (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033s.patch")
          cat dolbomon/patches/v0.3.4-exact-redesign.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v034.patch" && (cd "$SRC" && patch -p3 < "$RUNNER_TEMP/v034.patch")
          base64 -d dolbomon/patches/v0.3.4-system-insets.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v034i.patch" && (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v034i.patch")
          : > "$RUNNER_TEMP/v035.patch.gz"
          for p in dolbomon/patches/v0.3.5b-visual-match.patch.gz.b64.part-*; do base64 -d "$p" >> "$RUNNER_TEMP/v035.patch.gz"; done
          gzip -d < "$RUNNER_TEMP/v035.patch.gz" > "$RUNNER_TEMP/v035.patch" && (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v035.patch")
          for v in v0.3.6-visual-polish v0.3.7-record-flow v0.3.8-nav-spacing v0.3.9-message-center-polish v0.4.0-design-alignment v0.4.1-final-design; do
            base64 -d "dolbomon/patches/${v}.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/${v}.patch"
            (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/${v}.patch")
          done
          grep -q 'versionCode 18' "$SRC/app/build.gradle"
          grep -q 'versionName "0.4.1"' "$SRC/app/build.gradle"

      - name: Add API35 regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('${{ env.APP_DIR }}/app/build.gradle')
          s=p.read_text()
          marker="    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'"
          deps="\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n    androidTestImplementation 'androidx.test:core:1.6.1'\n    androidTestImplementation 'androidx.test:runner:1.6.2'"
          if 'androidx.test.ext:junit' not in s: s=s.replace(marker, marker+deps)
          p.write_text(s)
          PY
          TESTDIR="$APP_DIR/app/src/androidTest/java/com/easternwood/dolbomon"
          mkdir -p "$TESTDIR"
          cat > "$TESTDIR/FinalDesignDeviceTest.java" <<'JAVA'
          package com.easternwood.dolbomon;
          import static org.junit.Assert.*;
          import android.content.*;
          import android.view.View;
          import android.widget.LinearLayout;
          import androidx.test.core.app.ActivityScenario;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import androidx.test.platform.app.InstrumentationRegistry;
          import com.google.android.material.button.MaterialButton;
          import com.google.android.material.chip.*;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import java.lang.reflect.Field;
          @RunWith(AndroidJUnit4.class)
          public class FinalDesignDeviceTest {
            @Test public void recordSelectionAndFinalStepFlowStayStable() throws Exception {
              Context c=InstrumentationRegistry.getInstrumentation().getTargetContext();
              c.deleteDatabase("dolbomon.db");
              Field sf=DatabaseHelper.class.getDeclaredField("instance"); sf.setAccessible(true); sf.set(null,null);
              long id=DatabaseHelper.get(c).addSenior("홍길동","89","9","남성");
              try(ActivityScenario<RecordActivity> sc=ActivityScenario.launch(new Intent(c,RecordActivity.class).putExtra("senior_id",id).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))) {
                sc.onActivity(a->{ try {
                  ChipGroup meal=g(a,"mealGroup"), water=g(a,"waterGroup");
                  ((Chip)meal.getChildAt(1)).performClick(); ((Chip)water.getChildAt(0)).performClick();
                  click(a,"conditionGroup",0); click(a,"moodGroup",1); click(a,"sleepGroup",0); click(a,"bowelGroup",0); click(a,"activityLevelGroup",1);
                  assertTrue(((Chip)meal.getChildAt(1)).isChecked()); assertTrue(((Chip)water.getChildAt(0)).isChecked());
                  ((MaterialButton)get(a,"bottomAction")).performClick();
                  assertEquals(2,((Integer)get(a,"currentStep")).intValue());
                  assertEquals(View.VISIBLE,((LinearLayout)get(a,"step2Container")).getVisibility());
                  assertFalse(a.isFinishing());
                } catch(Exception e){ throw new RuntimeException(e); }});
              }
            }
            static ChipGroup g(Object a,String n)throws Exception{return(ChipGroup)get(a,n);}
            static void click(Object a,String n,int i)throws Exception{((Chip)g(a,n).getChildAt(i)).performClick();}
            static Object get(Object o,String n)throws Exception{Field f=o.getClass().getDeclaredField(n);f.setAccessible(true);return f.get(o);}
          }
          JAVA

      - name: Build debug and instrumentation APKs
        run: gradle -p "$APP_DIR" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: API35 regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            gradle -p "$APP_DIR" :app:connectedDebugAndroidTest
            if adb logcat -d | grep -E 'FATAL EXCEPTION|Process: com.easternwood.dolbomon'; then exit 1; fi
      - name: Lint release
        run: gradle -p "$APP_DIR" :app:lintRelease
      - name: Build release AAB
        run: gradle -p "$APP_DIR" :app:bundleRelease
      - name: Prepare final artifacts
        run: |
          mkdir -p out
          cp "$APP_DIR/app/build/outputs/apk/debug/DolbomOn-debug.apk" out/DolbomOn-v0.4.1-final-debug.apk
          cp "$APP_DIR/app/build/outputs/bundle/release/DolbomOn-release.aab" out/DolbomOn-v0.4.1-final-release.aab
          base64 -d "$APP_DIR/app/icon-source.b64" > out/DolbomOn-icon-512.png
      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.4.1-final-debug-apk
          path: out/DolbomOn-v0.4.1-final-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.4.1-final-release-aab
          path: out/DolbomOn-v0.4.1-final-release.aab
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-play-icon-v0.4.1
          path: out/DolbomOn-icon-512.png
          retention-days: 7

  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore v0.4.1 source
        run: |
          SRC="$APP_DIR"
          rm -rf "$SRC" && mkdir -p "$SRC"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$SRC"
          echo 'android.sourceset.disallowProvider=false' >> "$SRC/gradle.properties"
          for spec in 'v0.2.0-commercial:p2' 'v0.2.1-settings:p3' 'v0.2.2-korean-records:p2' 'v0.2.3-ui-fixes:p2' 'v0.3.0-redesign:p1' 'v0.3.1b-final-ui:p1' 'v0.3.2-record-ux:p1'; do
            name=${spec%%:*}; strip=${spec##*:}; cat dolbomon/patches/${name}.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/${name}.patch"; (cd "$SRC" && patch -${strip} < "$RUNNER_TEMP/${name}.patch");
          done
          cat dolbomon/patches/v0.3.3-stability-ui.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v033.patch" && (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033.patch")
          base64 -d dolbomon/patches/v0.3.3-scrollbar-crashfix.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v033s.patch" && (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033s.patch")
          cat dolbomon/patches/v0.3.4-exact-redesign.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v034.patch" && (cd "$SRC" && patch -p3 < "$RUNNER_TEMP/v034.patch")
          base64 -d dolbomon/patches/v0.3.4-system-insets.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v034i.patch" && (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v034i.patch")
          : > "$RUNNER_TEMP/v035.patch.gz"; for p in dolbomon/patches/v0.3.5b-visual-match.patch.gz.b64.part-*; do base64 -d "$p" >> "$RUNNER_TEMP/v035.patch.gz"; done
          gzip -d < "$RUNNER_TEMP/v035.patch.gz" > "$RUNNER_TEMP/v035.patch" && (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v035.patch")
          for v in v0.3.6-visual-polish v0.3.7-record-flow v0.3.8-nav-spacing v0.3.9-message-center-polish v0.4.0-design-alignment v0.4.1-final-design; do base64 -d "dolbomon/patches/${v}.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/${v}.patch"; (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/${v}.patch"); done

      - name: Add final visual seed hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('${{ env.APP_DIR }}')
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          for name in ['MainActivity','SeniorActivity','RecordActivity','HistoryActivity','SettingsActivity']:
              m=m.replace(f'android:name=".{name}" android:exported="false"', f'android:name=".{name}" android:exported="true"')
          manifest.write_text(m)

          main=root/'app/src/main/java/com/easternwood/dolbomon/MainActivity.java'
          s=main.read_text()
          hook='''        if (BuildConfig.DEBUG && getIntent().getBooleanExtra("visual_seed", false)) {\n            DatabaseHelper d = DatabaseHelper.get(this);\n            if (d.listSeniors().isEmpty()) {\n                long park=d.addSenior("박철수","86","12","남성"); sleepSeed();\n                long lee=d.addSenior("이순자","91","5","여성"); sleepSeed();\n                long kim=d.addSenior("김영희","85","2","여성"); sleepSeed();\n                long hong=d.addSenior("홍길동","89","9","남성");\n                DatabaseHelper.CareRecord p=new DatabaseHelper.CareRecord(); p.seniorId=park; p.timestamp=System.currentTimeMillis(); p.meal="normal"; d.addRecord(p);\n                DatabaseHelper.CareRecord q=new DatabaseHelper.CareRecord(); q.seniorId=lee; q.timestamp=System.currentTimeMillis(); q.meal="good"; q.water="normal"; q.condition="good"; q.mood="calm"; q.sleep="normal"; q.bowel="none"; q.generated="이순자 어르신의 오늘 소식입니다. 편안하게 생활하셨습니다."; d.addRecord(q);\n                DatabaseHelper.CareRecord z=new DatabaseHelper.CareRecord(); z.seniorId=kim; z.timestamp=System.currentTimeMillis(); z.meal="good"; z.water="enough"; z.condition="good"; z.mood="happy"; z.sleep="good"; z.bowel="normal"; z.generated="김영희 어르신의 오늘 소식입니다. 오늘도 편안하게 지내셨습니다."; long zid=d.addRecord(z); d.addShareLog(zid,0,"SMS");\n                for(int i=1;i<=6;i++){ DatabaseHelper.CareRecord r=new DatabaseHelper.CareRecord(); r.seniorId=hong; r.timestamp=System.currentTimeMillis()-((i<=2?1:i<=4?2:i==5?3:4)*86400000L)-(i%2)*5400000L; r.meal=(i%2==0?"normal":"good"); r.water="normal"; r.condition="good"; r.mood="calm"; r.sleep="normal"; r.bowel="normal"; r.activities=(i==2?"walk":i==4?"program":""); r.generated="홍길동 어르신의 일일 기록 및 전달 내용입니다."; long rid=d.addRecord(r); if(i!=3)d.addShareLog(rid,0,"SMS"); }\n            }\n        }\n'''
          if 'getBooleanExtra("visual_seed"' not in s:
              s=s.replace('        super.onCreate(savedInstanceState);\n','        super.onCreate(savedInstanceState);\n'+hook,1)
              s=s.replace('\n    @Override\n    protected void onNewIntent','\n    private static void sleepSeed(){ try{Thread.sleep(8);}catch(Exception ignored){} }\n\n    @Override\n    protected void onNewIntent',1)
          main.write_text(s)

          rec=root/'app/src/main/java/com/easternwood/dolbomon/RecordActivity.java'
          r=rec.read_text()
          hook='''        applyInitialStep();\n        if (BuildConfig.DEBUG && getIntent().hasExtra("visual_step")) {\n            int vs=getIntent().getIntExtra("visual_step",1);\n            if(mealGroup.getChildCount()>0)((Chip)mealGroup.getChildAt(0)).setChecked(true);\n            if(waterGroup.getChildCount()>1)((Chip)waterGroup.getChildAt(1)).setChecked(true);\n            if(conditionGroup.getChildCount()>0)((Chip)conditionGroup.getChildAt(0)).setChecked(true);\n            if(moodGroup.getChildCount()>0)((Chip)moodGroup.getChildAt(0)).setChecked(true);\n            if(sleepGroup.getChildCount()>0)((Chip)sleepGroup.getChildAt(0)).setChecked(true);\n            if(bowelGroup.getChildCount()>0)((Chip)bowelGroup.getChildAt(0)).setChecked(true);\n            if(activityLevelGroup.getChildCount()>0)((Chip)activityLevelGroup.getChildAt(0)).setChecked(true);\n            noteEdit.setText("오늘도 편안하게 생활하셨습니다. 식사와 수분 섭취가 좋았고 산책 프로그램에도 즐겁게 참여하셨습니다.");\n            if(vs==3) generate(true); else showStep(vs);\n        }\n'''
          r=r.replace('        applyInitialStep();\n',hook,1)
          rec.write_text(r)
          PY

      - name: Build debug APK
        run: gradle -p "$APP_DIR" :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Capture final six screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "$APP_DIR/app/build/outputs/apk/debug/DolbomOn-debug.apk"
            adb shell pm clear com.easternwood.dolbomon >/dev/null
            mkdir -p final-screens
            adb shell am start -W -n com.easternwood.dolbomon/.MainActivity --ez visual_seed true >/dev/null; sleep 1; adb exec-out screencap -p > final-screens/01-home.png
            adb shell am force-stop com.easternwood.dolbomon; adb shell am start -W -n com.easternwood.dolbomon/.SeniorActivity --el senior_id 4 >/dev/null; sleep 1; adb exec-out screencap -p > final-screens/02-detail.png
            adb shell am force-stop com.easternwood.dolbomon; adb shell am start -W -n com.easternwood.dolbomon/.RecordActivity --el senior_id 4 --ei visual_step 1 >/dev/null; sleep 1; adb exec-out screencap -p > final-screens/03-record.png
            adb shell am force-stop com.easternwood.dolbomon; adb shell am start -W -n com.easternwood.dolbomon/.RecordActivity --el senior_id 4 --ei visual_step 3 >/dev/null; sleep 1; adb exec-out screencap -p > final-screens/04-delivery.png
            adb shell am force-stop com.easternwood.dolbomon; adb shell am start -W -n com.easternwood.dolbomon/.HistoryActivity --el senior_id 4 >/dev/null; sleep 1; adb exec-out screencap -p > final-screens/05-history.png
            adb shell am force-stop com.easternwood.dolbomon; adb shell am start -W -n com.easternwood.dolbomon/.SettingsActivity >/dev/null; sleep 1; adb exec-out screencap -p > final-screens/06-settings.png
      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.4.1-final-design-screens
          path: final-screens
          retention-days: 7
