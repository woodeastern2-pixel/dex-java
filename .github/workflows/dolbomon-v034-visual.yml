name: DolbomOn v0.3.5 Visual Check

on:
  push:
    branches: [ 'feature/dolbomon-v034-exact-redesign' ]
    paths: [ '.github/workflows/dolbomon-v034-visual.yml', 'dolbomon/patches/v0.3.5b-visual-match.patch.gz.b64.part-*' ]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore v0.3.5 source and add visual hooks
        run: |
          SRC="$RUNNER_TEMP/dolbomon-src"
          rm -rf "$SRC" && mkdir -p "$SRC"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$SRC"
          echo 'android.sourceset.disallowProvider=false' >> "$SRC/gradle.properties"
          for spec in \
            'v0.2.0-commercial:p2' \
            'v0.2.1-settings:p3' \
            'v0.2.2-korean-records:p2' \
            'v0.2.3-ui-fixes:p2' \
            'v0.3.0-redesign:p1' \
            'v0.3.1b-final-ui:p1' \
            'v0.3.2-record-ux:p1'; do
            name=${spec%%:*}; strip=${spec##*:}
            cat dolbomon/patches/${name}.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/${name}.patch"
            (cd "$SRC" && patch -${strip} < "$RUNNER_TEMP/${name}.patch")
          done
          cat dolbomon/patches/v0.3.3-stability-ui.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v033.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033.patch")
          base64 -d dolbomon/patches/v0.3.3-scrollbar-crashfix.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v033-scroll.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033-scroll.patch")
          cat dolbomon/patches/v0.3.4-exact-redesign.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v034.patch"
          (cd "$SRC" && patch -p3 < "$RUNNER_TEMP/v034.patch")
          base64 -d dolbomon/patches/v0.3.4-system-insets.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v034-insets.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v034-insets.patch")

          : > "$RUNNER_TEMP/v035.patch.gz"
          for p in dolbomon/patches/v0.3.5b-visual-match.patch.gz.b64.part-*; do
            echo "decoding $p"
            base64 -d "$p" >> "$RUNNER_TEMP/v035.patch.gz"
          done
          gzip -t "$RUNNER_TEMP/v035.patch.gz"
          gzip -d < "$RUNNER_TEMP/v035.patch.gz" > "$RUNNER_TEMP/v035.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v035.patch")

          rm -rf source-export
          mkdir -p source-export/app/src/main
          cp -R "$SRC/app/src/main/java" source-export/app/src/main/
          cp -R "$SRC/app/src/main/res" source-export/app/src/main/
          cp "$SRC/app/build.gradle" source-export/app/build.gradle
          cp "$SRC/app/src/main/AndroidManifest.xml" source-export/app/src/main/AndroidManifest.xml

          python3 - <<'PY'
          from pathlib import Path
          root=Path('${{ runner.temp }}/dolbomon-src')
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          for name in ['SeniorActivity','RecordActivity','HistoryActivity','SettingsActivity']:
              m=m.replace(f'android:name=".{name}" android:exported="false"', f'android:name=".{name}" android:exported="true"')
          manifest.write_text(m)

          main=root/'app/src/main/java/com/easternwood/dolbomon/MainActivity.java'
          s=main.read_text()
          hook='''        if (BuildConfig.DEBUG && getIntent().getBooleanExtra("visual_seed", false)) {\n            DatabaseHelper visualDb = DatabaseHelper.get(this);\n            visualDb.addSenior("박철수", "86", "12", "");\n            visualDb.addSenior("이순자", "91", "5", "");\n            visualDb.addSenior("김영희", "85", "2", "");\n            visualDb.addSenior("홍길동", "89", "9", "");\n        }\n'''
          if 'visual_seed' not in s:
              s=s.replace('        super.onCreate(savedInstanceState);\n', '        super.onCreate(savedInstanceState);\n'+hook, 1)
          main.write_text(s)

          rec=root/'app/src/main/java/com/easternwood/dolbomon/RecordActivity.java'
          r=rec.read_text()
          if 'visual_step' not in r:
              hook='''        applyInitialStep();\n        if (BuildConfig.DEBUG && getIntent().hasExtra("visual_step")) {\n            int visualStep = getIntent().getIntExtra("visual_step", 1);\n            if (visualStep == 3) generate(true);\n            else showStep(visualStep);\n        }\n'''
              r=r.replace('        applyInitialStep();\n',hook,1)
          rec.write_text(r)
          PY

      - name: Upload reconstructed v0.3.5 source
        uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.3.5-reconstructed-source
          path: source-export
          retention-days: 2

      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture six screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -prop persist.sys.locale=ko-KR -prop persist.sys.language=ko -prop persist.sys.country=KR
          disable-animations: true
          script: |
            adb shell settings put global anr_show_background 0
            adb install -r "$RUNNER_TEMP/dolbomon-src/app/build/outputs/apk/debug/DolbomOn-debug.apk"
            adb shell pm clear com.easternwood.dolbomon >/dev/null
            mkdir -p visual-screens

            adb shell am start -W -n com.easternwood.dolbomon/.MainActivity --ez visual_seed true >/dev/null
            sleep 1
            adb exec-out screencap -p > visual-screens/01-home.png

            adb shell am force-stop com.easternwood.dolbomon
            adb shell am start -W -n com.easternwood.dolbomon/.SeniorActivity --el senior_id 4 >/dev/null
            sleep 1
            adb exec-out screencap -p > visual-screens/02-detail.png

            adb shell am force-stop com.easternwood.dolbomon
            adb shell am start -W -n com.easternwood.dolbomon/.RecordActivity --el senior_id 4 >/dev/null
            sleep 1
            adb exec-out screencap -p > visual-screens/03-record.png

            adb shell am force-stop com.easternwood.dolbomon
            adb shell am start -W -n com.easternwood.dolbomon/.RecordActivity --el senior_id 4 --ei visual_step 3 >/dev/null
            sleep 1
            adb exec-out screencap -p > visual-screens/04-delivery.png

            adb shell am force-stop com.easternwood.dolbomon
            adb shell am start -W -n com.easternwood.dolbomon/.HistoryActivity --el senior_id 4 >/dev/null
            sleep 1
            adb exec-out screencap -p > visual-screens/05-history.png

            adb shell am force-stop com.easternwood.dolbomon
            adb shell am start -W -n com.easternwood.dolbomon/.SettingsActivity >/dev/null
            sleep 1
            adb exec-out screencap -p > visual-screens/06-settings.png

            test -s visual-screens/01-home.png
            test -s visual-screens/02-detail.png
            test -s visual-screens/03-record.png
            test -s visual-screens/04-delivery.png
            test -s visual-screens/05-history.png
            test -s visual-screens/06-settings.png

      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.3.5-visual-screens
          path: visual-screens
          retention-days: 2
