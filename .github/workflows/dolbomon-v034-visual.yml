name: DolbomOn v0.3.4 Visual Check

on:
  push:
    branches: [ 'feature/dolbomon-v034-exact-redesign' ]
    paths: [ '.github/workflows/dolbomon-v034-visual.yml' ]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore source and add visual test
        run: |
          SRC="$RUNNER_TEMP/dolbomon-src"
          rm -rf "$SRC" && mkdir -p "$SRC"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$SRC"
          echo 'android.sourceset.disallowProvider=false' >> "$SRC/gradle.properties"
          for spec in \
            'v0.2.0-commercial:p2' \
            'v0.2.1-settings:p3' \
            'v0.2.2-korean-records:p2' \
            'v0.2.3-ui-fixes:p2' \
            'v0.3.0-redesign:p1' \
            'v0.3.1b-final-ui:p1' \
            'v0.3.2-record-ux:p1'; do
            name=${spec%%:*}; strip=${spec##*:}
            cat dolbomon/patches/${name}.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/${name}.patch"
            (cd "$SRC" && patch -${strip} < "$RUNNER_TEMP/${name}.patch")
          done
          cat dolbomon/patches/v0.3.3-stability-ui.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v033.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033.patch")
          base64 -d dolbomon/patches/v0.3.3-scrollbar-crashfix.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v033-scroll.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033-scroll.patch")
          cat dolbomon/patches/v0.3.4-exact-redesign.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v034.patch"
          (cd "$SRC" && patch -p3 < "$RUNNER_TEMP/v034.patch")

          python3 - <<'PY'
          from pathlib import Path
          p=Path('${{ runner.temp }}/dolbomon-src/app/build.gradle')
          s=p.read_text()
          marker="    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'"
          deps="\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n    androidTestImplementation 'androidx.test:core:1.6.1'\n    androidTestImplementation 'androidx.test:runner:1.6.2'"
          if 'androidx.test.ext:junit' not in s:
              s=s.replace(marker, marker+deps)
          p.write_text(s)
          PY

          TESTDIR="$SRC/app/src/androidTest/java/com/easternwood/dolbomon"
          mkdir -p "$TESTDIR"
          cat > "$TESTDIR/VisualScreensDeviceTest.java" <<'JAVA'
          package com.easternwood.dolbomon;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.os.ParcelFileDescriptor;
          import androidx.test.core.app.ActivityScenario;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import androidx.test.platform.app.InstrumentationRegistry;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import java.io.FileInputStream;
          import java.lang.reflect.Field;
          import java.lang.reflect.Method;

          @RunWith(AndroidJUnit4.class)
          public class VisualScreensDeviceTest {
            interface Action { void run(Activity a); }

            @Test public void captureSixScreens() throws Exception {
              Context c=InstrumentationRegistry.getInstrumentation().getTargetContext();
              c.deleteDatabase("dolbomon.db");
              Field sf=DatabaseHelper.class.getDeclaredField("instance");
              sf.setAccessible(true);
              sf.set(null,null);
              DatabaseHelper db=DatabaseHelper.get(c);
              long id=db.addSenior("홍길동","89","9","");
              db.addSenior("김영희","85","2","");
              db.addSenior("이순자","91","5","");
              db.addSenior("박철수","86","12","");

              shell("rm -rf /data/local/tmp/dolbomon-v034 && mkdir -p /data/local/tmp/dolbomon-v034");
              cap(new Intent(c,MainActivity.class),"01-home.png",null);
              cap(new Intent(c,SeniorActivity.class).putExtra("senior_id",id),"02-detail.png",null);
              cap(new Intent(c,RecordActivity.class).putExtra("senior_id",id),"03-record.png",null);
              cap(new Intent(c,RecordActivity.class).putExtra("senior_id",id),"04-delivery.png",a->{
                try {
                  Method g=RecordActivity.class.getDeclaredMethod("generate",boolean.class);
                  g.setAccessible(true);
                  g.invoke(a,false);
                  Method s=RecordActivity.class.getDeclaredMethod("showStep",int.class);
                  s.setAccessible(true);
                  s.invoke(a,3);
                } catch(Exception e) { throw new RuntimeException(e); }
              });
              cap(new Intent(c,HistoryActivity.class).putExtra("senior_id",id),"05-history.png",null);
              cap(new Intent(c,SettingsActivity.class),"06-settings.png",null);
            }

            static void cap(Intent i,String name,Action action) throws Exception {
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try(ActivityScenario sc=ActivityScenario.launch(i)) {
                if(action!=null) sc.onActivity(a->action.run((Activity)a));
                InstrumentationRegistry.getInstrumentation().waitForIdleSync();
                Thread.sleep(700);
                shell("screencap -p /data/local/tmp/dolbomon-v034/"+name);
              }
            }

            static void shell(String cmd) throws Exception {
              ParcelFileDescriptor pfd=InstrumentationRegistry.getInstrumentation().getUiAutomation().executeShellCommand(cmd);
              try(FileInputStream in=new FileInputStream(pfd.getFileDescriptor())) {
                byte[] b=new byte[1024];
                while(in.read(b)!=-1) {}
              }
              pfd.close();
            }
          }
          JAVA

      - name: Build visual APKs
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture six screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle -p "$RUNNER_TEMP/dolbomon-src" :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.easternwood.dolbomon.VisualScreensDeviceTest
            mkdir -p visual-screens
            adb pull /data/local/tmp/dolbomon-v034/. visual-screens/
            test -s visual-screens/01-home.png
            test -s visual-screens/02-detail.png
            test -s visual-screens/03-record.png
            test -s visual-screens/04-delivery.png
            test -s visual-screens/05-history.png
            test -s visual-screens/06-settings.png

      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.3.4-visual-screens
          path: visual-screens
          retention-days: 2
