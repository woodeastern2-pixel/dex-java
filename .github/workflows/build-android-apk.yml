name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ai_voc_assistant/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_voc_assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: |
          for attempt in 1 2 3; do
            flutter test && exit 0
            echo "flutter test attempt $attempt failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-voc-assistant-apk
          path: ai_voc_assistant/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
