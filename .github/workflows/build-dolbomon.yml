name: Build DolbomOn

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'dolbomon/**'
      - '.github/workflows/build-dolbomon.yml'
  push:
    branches:
      - 'feature/dolbomon-*'
    paths:
      - 'dolbomon/**'
      - '.github/workflows/build-dolbomon.yml'

concurrency:
  group: dolbomon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dolbomon:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore v0.3.2 source and add device test
        run: |
          SRC="$RUNNER_TEMP/dolbomon-src"
          rm -rf "$SRC" && mkdir -p "$SRC"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$SRC"
          echo 'android.sourceset.disallowProvider=false' >> "$SRC/gradle.properties"
          for spec in 'v0.2.0-commercial:p2' 'v0.2.1-settings:p3' 'v0.2.2-korean-records:p2' 'v0.2.3-ui-fixes:p2' 'v0.3.0-redesign:p1' 'v0.3.1b-final-ui:p1' 'v0.3.2-record-ux:p1'; do
            name=${spec%%:*}; strip=${spec##*:}; cat dolbomon/patches/${name}.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/${name}.patch"; (cd "$SRC" && patch -${strip} < "$RUNNER_TEMP/${name}.patch");
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('${{ runner.temp }}/dolbomon-src/app/build.gradle'); s=p.read_text()
          s=s.replace("    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'", "    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n    androidTestImplementation 'androidx.test:core:1.6.1'\n    androidTestImplementation 'androidx.test:runner:1.6.2'")
          p.write_text(s)
          PY
          mkdir -p "$SRC/app/src/androidTest/java/com/easternwood/dolbomon"
          cat > "$SRC/app/src/androidTest/java/com/easternwood/dolbomon/RecordStepDeviceTest.java" <<'JAVA'
          package com.easternwood.dolbomon;

          import static org.junit.Assert.*;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.view.View;
          import android.widget.LinearLayout;
          import androidx.test.core.app.ActivityScenario;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import androidx.test.platform.app.InstrumentationRegistry;
          import com.google.android.material.button.MaterialButton;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import java.lang.reflect.Field;

          @RunWith(AndroidJUnit4.class)
          public class RecordStepDeviceTest {
            @Test public void nextMovesToStep2OnRealAndroid() throws Exception {
              Context c = InstrumentationRegistry.getInstrumentation().getTargetContext();
              c.deleteDatabase("dolbomon.db");
              Field singleton = DatabaseHelper.class.getDeclaredField("instance"); singleton.setAccessible(true); singleton.set(null, null);
              DatabaseHelper db = DatabaseHelper.get(c);
              ContentValues v = new ContentValues(); v.put("name", ""); v.put("birth", ""); v.put("room", ""); v.put("notes", ""); v.put("created_at", System.currentTimeMillis());
              long id = db.getWritableDatabase().insertOrThrow("seniors", null, v);
              Intent intent = new Intent(c, RecordActivity.class).putExtra("senior_id", id); intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try (ActivityScenario<RecordActivity> scenario = ActivityScenario.launch(intent)) {
                scenario.onActivity(a -> {
                  try {
                    MaterialButton next=(MaterialButton)get(a,"bottomAction");
                    next.performClick();
                    assertFalse(a.isFinishing());
                    assertEquals(2, ((Integer)get(a,"currentStep")).intValue());
                    assertEquals(View.VISIBLE, ((LinearLayout)get(a,"step2Container")).getVisibility());
                  } catch(Exception e) { throw new RuntimeException(e); }
                });
                Thread.sleep(1500);
                scenario.onActivity(a -> assertFalse("RecordActivity disappeared after layout", a.isFinishing()));
              }
            }
            private static Object get(Object o,String n) throws Exception { Field f=o.getClass().getDeclaredField(n); f.setAccessible(true); return f.get(o); }
          }
          JAVA
      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device transition test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            gradle -p "$RUNNER_TEMP/dolbomon-src" :app:connectedDebugAndroidTest || { adb logcat -d '*:E'; exit 1; }
            adb logcat -d -t 400 '*:E'
