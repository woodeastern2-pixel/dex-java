name: Build DolbomOn

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'dolbomon/**'
      - 'privacy/dolbomon.md'
      - '.github/workflows/build-dolbomon.yml'
  push:
    branches:
      - main
      - 'feature/dolbomon-*'
      - 'dolbomon-*'
    paths:
      - 'dolbomon/**'
      - 'privacy/dolbomon.md'
      - '.github/workflows/build-dolbomon.yml'

concurrency:
  group: dolbomon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore Android source and apply v0.3.3
        run: |
          SRC="$RUNNER_TEMP/dolbomon-src"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$SRC"
          echo 'android.sourceset.disallowProvider=false' >> "$SRC/gradle.properties"

          for spec in \
            'v0.2.0-commercial:p2' \
            'v0.2.1-settings:p3' \
            'v0.2.2-korean-records:p2' \
            'v0.2.3-ui-fixes:p2' \
            'v0.3.0-redesign:p1' \
            'v0.3.1b-final-ui:p1' \
            'v0.3.2-record-ux:p1'; do
            name=${spec%%:*}
            strip=${spec##*:}
            cat dolbomon/patches/${name}.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/${name}.patch"
            (cd "$SRC" && patch -${strip} < "$RUNNER_TEMP/${name}.patch")
          done

          base64 -d dolbomon/patches/v0.3.3-stability-ui.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v0.3.3-stability-ui.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v0.3.3-stability-ui.patch")

          python3 - <<'PY'
          from pathlib import Path
          p=Path('${{ runner.temp }}/dolbomon-src/app/build.gradle')
          s=p.read_text()
          s=s.replace("    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'", "    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n    androidTestImplementation 'androidx.test:core:1.6.1'\n    androidTestImplementation 'androidx.test:runner:1.6.2'")
          p.write_text(s)
          PY

          mkdir -p "$SRC/app/src/androidTest/java/com/easternwood/dolbomon"
          cat > "$SRC/app/src/androidTest/java/com/easternwood/dolbomon/RecordStepDeviceTest.java" <<'JAVA'
          package com.easternwood.dolbomon;

          import static org.junit.Assert.*;

          import android.content.Context;
          import android.content.Intent;
          import android.view.View;
          import android.widget.LinearLayout;

          import androidx.test.core.app.ActivityScenario;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import androidx.test.platform.app.InstrumentationRegistry;

          import com.google.android.material.button.MaterialButton;
          import com.google.android.material.chip.Chip;
          import com.google.android.material.chip.ChipGroup;

          import org.junit.Test;
          import org.junit.runner.RunWith;

          import java.lang.reflect.Field;

          @RunWith(AndroidJUnit4.class)
          public class RecordStepDeviceTest {
              @Test
              public void selectionsThenNextKeepRecordActivityAliveAndRestoreStep() throws Exception {
                  Context c = InstrumentationRegistry.getInstrumentation().getTargetContext();
                  c.deleteDatabase("dolbomon.db");
                  Field singleton = DatabaseHelper.class.getDeclaredField("instance");
                  singleton.setAccessible(true);
                  singleton.set(null, null);

                  DatabaseHelper db = DatabaseHelper.get(c);
                  long id = db.addSenior("테스트 어르신", "80", "101", "");
                  Intent intent = new Intent(c, RecordActivity.class)
                          .putExtra("senior_id", id)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                  try (ActivityScenario<RecordActivity> scenario = ActivityScenario.launch(intent)) {
                      scenario.onActivity(a -> {
                          try {
                              clickChoice(a, "mealGroup", 1);
                              clickChoice(a, "waterGroup", 0);
                              clickChoice(a, "conditionGroup", 0);
                              clickChoice(a, "moodGroup", 1);
                              clickChoice(a, "sleepGroup", 0);
                              clickChoice(a, "bowelGroup", 0);

                              MaterialButton next = (MaterialButton) get(a, "bottomAction");
                              next.performClick();

                              assertFalse(a.isFinishing());
                              assertFalse(a.isDestroyed());
                              assertEquals(2, ((Integer) get(a, "currentStep")).intValue());
                              assertEquals(View.VISIBLE, ((LinearLayout) get(a, "step2Container")).getVisibility());
                          } catch (Exception e) {
                              throw new RuntimeException(e);
                          }
                      });

                      Thread.sleep(600);
                      scenario.onActivity(a -> {
                          try {
                              assertFalse(a.isFinishing());
                              assertFalse(a.isDestroyed());
                              assertEquals(2, ((Integer) get(a, "currentStep")).intValue());
                          } catch (Exception e) {
                              throw new RuntimeException(e);
                          }
                      });

                      scenario.recreate();
                      Thread.sleep(400);
                      scenario.onActivity(a -> {
                          try {
                              assertFalse(a.isFinishing());
                              assertEquals(2, ((Integer) get(a, "currentStep")).intValue());
                              assertEquals(View.VISIBLE, ((LinearLayout) get(a, "step2Container")).getVisibility());
                          } catch (Exception e) {
                              throw new RuntimeException(e);
                          }
                      });
                  }
              }

              private static void clickChoice(Object activity, String field, int child) throws Exception {
                  ChipGroup group = (ChipGroup) get(activity, field);
                  ((Chip) group.getChildAt(child)).performClick();
              }

              private static Object get(Object o, String name) throws Exception {
                  Field f = o.getClass().getDeclaredField(name);
                  f.setAccessible(true);
                  return f.get(o);
              }
          }
          JAVA

          grep -n 'versionCode\|versionName' "$SRC/app/build.gradle"

      - name: Build debug and instrumentation APKs
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device record-flow regression test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            gradle -p "$RUNNER_TEMP/dolbomon-src" :app:connectedDebugAndroidTest || { adb logcat -d -t 1000 '*:E'; exit 1; }
            adb logcat -d -t 500 '*:E'

      - name: Lint release
        run: |
          if ! gradle -p "$RUNNER_TEMP/dolbomon-src" :app:lintRelease; then
            echo "===== DolbomOn lint report ====="
            find "$RUNNER_TEMP/dolbomon-src/app/build" -name 'lint-results-release.txt' -print -exec cat {} \; || true
            exit 1
          fi

      - name: Build release AAB
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:bundleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/dolbomon-src/app/build/outputs/apk/debug/DolbomOn-debug.apk" out/DolbomOn-v0.3.3-debug.apk
          cp "$RUNNER_TEMP/dolbomon-src/app/build/outputs/bundle/release/DolbomOn-release.aab" out/DolbomOn-v0.3.3-release.aab
          base64 -d "$RUNNER_TEMP/dolbomon-src/app/icon-source.b64" > out/DolbomOn-icon-512.png

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.3.3-debug-apk
          path: out/DolbomOn-v0.3.3-debug.apk
          retention-days: 7

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.3.3-release-aab
          path: out/DolbomOn-v0.3.3-release.aab
          retention-days: 7

      - name: Upload Play icon
        uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-play-icon-v0.3.3
          path: out/DolbomOn-icon-512.png
          retention-days: 7
