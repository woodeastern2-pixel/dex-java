name: Release WhereIsIt

on:
  workflow_dispatch:
  push:
    branches:
      - feature/whereisit-v130-release

permissions:
  contents: read

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMOB_APP_ID: ca-app-pub-9360550840761530~8809407191
      ADMOB_BANNER_ID: ca-app-pub-9360550840761530/8722766965
      ADMOB_REWARDED_INTERSTITIAL_ID: ca-app-pub-9360550840761530/7837060708
      WHEREISIT_KEYSTORE_BASE64: ${{ secrets.WHEREISIT_KEYSTORE_BASE64 }}
      WHEREISIT_KEYSTORE_PASSWORD: ${{ secrets.WHEREISIT_KEYSTORE_PASSWORD }}
      WHEREISIT_KEY_ALIAS: ${{ secrets.WHEREISIT_KEY_ALIAS }}
      WHEREISIT_KEY_PASSWORD: ${{ secrets.WHEREISIT_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare Play upload key
        shell: bash
        run: |
          test -n "$WHEREISIT_KEYSTORE_BASE64"
          test -n "$WHEREISIT_KEYSTORE_PASSWORD"
          test -n "$WHEREISIT_KEY_ALIAS"
          test -n "$WHEREISIT_KEY_PASSWORD"
          printf '%s' "$WHEREISIT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whereisit-upload.jks"
          echo "WHEREISIT_KEYSTORE_PATH=$RUNNER_TEMP/whereisit-upload.jks" >> "$GITHUB_ENV"

      - name: Verify original Play upload key
        shell: bash
        run: |
          expected_sha1="AC:1C:FF:56:88:01:51:93:E5:96:80:E7:C4:B7:03:6F:72:A0:72:63"
          actual_sha1="$(keytool -exportcert -keystore "$WHEREISIT_KEYSTORE_PATH" -storepass "$WHEREISIT_KEYSTORE_PASSWORD" -alias "$WHEREISIT_KEY_ALIAS" -rfc | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          test "$actual_sha1" = "$expected_sha1"

      - name: Verify production configuration
        run: gradle -p whereIsIt :app:verifyProductionReadiness

      - name: Test 60-minute reward window
        run: gradle -p whereIsIt :app:testDebugUnitTest

      - name: Build signed production APK and AAB
        run: gradle -p whereIsIt :app:assembleRelease :app:bundleRelease :app:lintRelease

      - name: Upload signed production APK
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.3.0-production-apk
          path: whereIsIt/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed production AAB
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsIt-v1.3.0-production-aab
          path: whereIsIt/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
