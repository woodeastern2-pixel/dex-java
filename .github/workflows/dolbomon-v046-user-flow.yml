name: DolbomOn v0.4.6 User Flow Check

on:
  workflow_dispatch:
  push:
    branches: [ 'feature/dolbomon-v034-exact-redesign' ]
    paths:
      - '.github/workflows/dolbomon-v046-user-flow.yml'
      - 'dolbomon/ci/prepare-v046-user-flow.py'
      - 'dolbomon/ci/run-v046-user-flow.sh'

jobs:
  user-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore v0.4.6 source
        run: bash dolbomon/ci/restore-v046.sh "$RUNNER_TEMP/dolbomon-src"

      - name: Prepare user-flow regression
        run: |
          python3 dolbomon/ci/visual-seed-v041.py "$RUNNER_TEMP/dolbomon-src"
          python3 dolbomon/ci/prepare-v046-user-flow.py "$RUNNER_TEMP/dolbomon-src"

      - name: Build debug and test APKs
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API35 record photo delivery share flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash dolbomon/ci/run-v046-user-flow.sh "$RUNNER_TEMP/dolbomon-src"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DolbomOn-v0.4.6-user-flow-screens
          path: flow-screens
          if-no-files-found: ignore
          retention-days: 7
