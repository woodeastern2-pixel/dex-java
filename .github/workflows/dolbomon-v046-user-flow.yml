name: DolbomOn v0.4.6 User Flow Check

on:
  workflow_dispatch:
  push:
    branches: [ 'feature/dolbomon-v034-exact-redesign' ]
    paths:
      - '.github/workflows/dolbomon-v046-user-flow.yml'

jobs:
  user-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore v0.4.6 source
        run: bash dolbomon/ci/restore-v046.sh "$RUNNER_TEMP/dolbomon-src"

      - name: Add share regression and visual photo hooks
        run: |
          python3 dolbomon/ci/visual-seed-v041.py "$RUNNER_TEMP/dolbomon-src"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('${{ runner.temp }}/dolbomon-src')
          p=root/'app/build.gradle'
          s=p.read_text()
          marker="    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'"
          deps="\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n    androidTestImplementation 'androidx.test:core:1.6.1'\n    androidTestImplementation 'androidx.test:runner:1.6.2'"
          if 'androidx.test.ext:junit' not in s: s=s.replace(marker, marker+deps)
          p.write_text(s)

          r=root/'app/src/main/java/com/easternwood/dolbomon/RecordActivity.java'
          rs=r.read_text()
          hook='''        buildUi();\n        if (BuildConfig.DEBUG && getIntent().getBooleanExtra("visual_photos", false)) {\n            try {\n                File d = new File(getFilesDir(), "photos"); d.mkdirs();\n                for (int i = 1; i <= 2; i++) {\n                    File f = new File(d, "visual_" + i + ".png");\n                    Bitmap b = Bitmap.createBitmap(320, 220, Bitmap.Config.ARGB_8888);\n                    b.eraseColor(i == 1 ? Color.rgb(151, 220, 215) : Color.rgb(247, 199, 112));\n                    try (FileOutputStream o = new FileOutputStream(f)) { b.compress(Bitmap.CompressFormat.PNG, 100, o); }\n                    b.recycle();\n                    photoPaths.add(f.getAbsolutePath());\n                }\n            } catch (Exception ignored) {}\n        }\n'''
          rs=rs.replace('        buildUi();\n',hook,1)
          r.write_text(rs)
          PY
          TESTDIR="$RUNNER_TEMP/dolbomon-src/app/src/androidTest/java/com/easternwood/dolbomon"
          mkdir -p "$TESTDIR"
          cat > "$TESTDIR/ShareIntentDeviceTest.java" <<'JAVA'
          package com.easternwood.dolbomon;
          import static org.junit.Assert.*;
          import android.content.Context;
          import android.content.Intent;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import androidx.test.platform.app.InstrumentationRegistry;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;

          @RunWith(AndroidJUnit4.class)
          public class ShareIntentDeviceTest {
            private ArrayList<String> photos(Context c) throws Exception {
              File d=new File(c.getFilesDir(),"photos"); d.mkdirs();
              ArrayList<String> out=new ArrayList<>();
              for(int i=0;i<2;i++){ File f=new File(d,"share-test-"+i+".jpg"); try(FileOutputStream o=new FileOutputStream(f)){o.write(new byte[]{1,2,3,4});} out.add(f.getAbsolutePath()); }
              return out;
            }
            @Test public void smsEmailKakaoKeepBodyAndPhotos() throws Exception {
              Context c=InstrumentationRegistry.getInstrumentation().getTargetContext();
              ArrayList<String> photos=photos(c); String body="홍길동 어르신의 전달문 테스트입니다.";
              DatabaseHelper.Guardian sms=new DatabaseHelper.Guardian(); sms.method="SMS"; sms.phone="01012345678";
              Intent si=ShareHelper.buildIntent(c,sms,"제목",body,photos);
              assertEquals(Intent.ACTION_SEND_MULTIPLE,si.getAction()); assertEquals(body,si.getStringExtra(Intent.EXTRA_TEXT)); assertEquals(body,si.getStringExtra("sms_body"));
              assertNotNull(si.getClipData()); assertEquals(2,si.getClipData().getItemCount()); assertEquals(2,si.getParcelableArrayListExtra(Intent.EXTRA_STREAM).size());
              DatabaseHelper.Guardian email=new DatabaseHelper.Guardian(); email.method="EMAIL"; email.email="test@example.com";
              Intent ei=ShareHelper.buildIntent(c,email,"제목",body,photos); assertEquals(body,ei.getStringExtra(Intent.EXTRA_TEXT)); assertNotNull(ei.getClipData()); assertEquals(2,ei.getClipData().getItemCount());
              DatabaseHelper.Guardian kakao=new DatabaseHelper.Guardian(); kakao.method="KAKAO";
              Intent ki=ShareHelper.buildIntent(c,kakao,"제목",body,photos); assertEquals(body,ki.getStringExtra(Intent.EXTRA_TEXT)); assertNotNull(ki.getClipData()); assertEquals(2,ki.getClipData().getItemCount());
            }
          }
          JAVA

      - name: Build debug and test APKs
        run: gradle -p "$RUNNER_TEMP/dolbomon-src" :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API35 record photo delivery share flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle -p "$RUNNER_TEMP/dolbomon-src" :app:connectedDebugAndroidTest
            adb install -r "$RUNNER_TEMP/dolbomon-src/app/build/outputs/apk/debug/DolbomOn-debug.apk"
            adb shell pm clear com.easternwood.dolbomon >/dev/null
            mkdir -p flow-screens
            adb shell am start -W -n com.easternwood.dolbomon/.MainActivity --ez visual_seed true >/dev/null
            sleep 3
            adb shell am force-stop com.easternwood.dolbomon
            adb shell am start -W -n com.easternwood.dolbomon/.RecordActivity --el senior_id 4 --ei visual_step 2 --ez visual_photos true >/dev/null
            sleep 2
            adb shell input swipe 540 1800 540 650 500
            adb shell input swipe 540 1800 540 650 500
            sleep 1
            adb shell uiautomator dump /sdcard/step2.xml >/dev/null
            adb pull /sdcard/step2.xml flow-screens/step2.xml >/dev/null
            grep -q '사진 2장' flow-screens/step2.xml
            grep -q '사진 삭제' flow-screens/step2.xml
            adb exec-out screencap -p > flow-screens/01-record-photo-2.png
            python3 - <<'PY'
            import re,subprocess
            s=open('flow-screens/step2.xml').read(); m=re.search(r'text="사진 삭제"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',s)
            assert m, 'delete photo button missing'; x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2
            subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
            PY
            sleep 1
            adb shell uiautomator dump /sdcard/step2-after.xml >/dev/null
            adb pull /sdcard/step2-after.xml flow-screens/step2-after.xml >/dev/null
            grep -q '사진 1장' flow-screens/step2-after.xml
            adb exec-out screencap -p > flow-screens/02-record-photo-1.png
            adb shell am force-stop com.easternwood.dolbomon
            adb shell am start -W -n com.easternwood.dolbomon/.RecordActivity --el senior_id 4 --ei visual_step 3 --ez visual_photos true >/dev/null
            sleep 2
            adb shell input swipe 540 1800 540 700 500
            adb shell input swipe 540 1800 540 700 500
            sleep 1
            adb shell uiautomator dump /sdcard/delivery.xml >/dev/null
            adb pull /sdcard/delivery.xml flow-screens/delivery.xml >/dev/null
            grep -q '첨부 사진' flow-screens/delivery.xml
            grep -q '사진 삭제' flow-screens/delivery.xml
            grep -q '상세 보기' flow-screens/delivery.xml
            grep -q '지난 기록' flow-screens/delivery.xml
            adb exec-out screencap -p > flow-screens/03-delivery.png
            if adb logcat -d | grep -E 'FATAL EXCEPTION|Process: com.easternwood.dolbomon'; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: DolbomOn-v0.4.6-user-flow-screens
          path: flow-screens
          retention-days: 7
