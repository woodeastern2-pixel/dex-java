name: Build SignPDF

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'signPdf/**'
      - '.github/workflows/build-signpdf.yml'
  push:
    branches:
      - main
      - 'signpdf-*'
    paths:
      - 'signPdf/**'
      - '.github/workflows/build-signpdf.yml'

# 여러 수정 커밋이 연속으로 올라오면 이전 SignPDF 빌드를 자동 취소합니다.
# v1.5부터 기능 브랜치는 검증만 수행하고 빌드 산출물은 main에서만 보관합니다.
concurrency:
  group: signpdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signpdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p signPdf :app:assembleDebug

      - name: Build release AAB
        run: gradle -p signPdf :app:bundleRelease

      - name: Lint release
        run: |
          if ! gradle -p signPdf :app:lintRelease; then
            echo "===== SignPDF lint report ====="
            cat signPdf/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
            exit 1
          fi

      - name: Upload debug APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SignPDF-v1.5.0-debug-apk
          path: signPdf/app/build/outputs/apk/debug/SignPDF-debug.apk
          retention-days: 7

      - name: Upload release AAB
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SignPDF-v1.5.0-release-aab
          path: signPdf/app/build/outputs/bundle/release/SignPDF-release.aab
          retention-days: 7
