name: Build SignPDF

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'signPdf/**'
      - '.github/workflows/build-signpdf.yml'
  push:
    branches: [ main ]
    paths:
      - 'signPdf/**'
      - '.github/workflows/build-signpdf.yml'

jobs:
  build-signpdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p signPdf :app:assembleDebug

      - name: Build release AAB
        run: gradle -p signPdf :app:bundleRelease

      - name: Lint release
        run: |
          if ! gradle -p signPdf :app:lintRelease; then
            echo "===== SignPDF lint report ====="
            cat signPdf/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
            exit 1
          fi

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SignPDF-v1.4.1-debug-apk
          path: signPdf/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SignPDF-v1.4.1-release-aab
          path: signPdf/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
