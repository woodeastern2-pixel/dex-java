name: Build SignPDF

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'signPdf/**'
      - '.github/workflows/build-signpdf.yml'
  push:
    branches:
      - main
      - 'signpdf-*'
      - 'agent/signpdf-*'
    paths:
      - 'signPdf/**'
      - '.github/workflows/build-signpdf.yml'

concurrency:
  group: signpdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signpdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        run: gradle -p signPdf :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p signPdf :app:assembleDebug

      - name: Prepare optional Play upload signing
        id: release_signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNPDF_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNPDF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNPDF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNPDF_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/signpdf-upload-key.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "keystore_file=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "keystore_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release AAB
        env:
          SIGNPDF_KEYSTORE_FILE: ${{ steps.release_signing.outputs.keystore_file }}
          SIGNPDF_KEYSTORE_PASSWORD: ${{ secrets.SIGNPDF_KEYSTORE_PASSWORD }}
          SIGNPDF_KEY_ALIAS: ${{ secrets.SIGNPDF_KEY_ALIAS }}
          SIGNPDF_KEY_PASSWORD: ${{ secrets.SIGNPDF_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.SIGNPDF_ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.SIGNPDF_ADMOB_BANNER_ID }}
        run: gradle -p signPdf :app:bundleRelease

      - name: Verify signed Play AAB
        if: steps.release_signing.outputs.configured == 'true'
        run: jarsigner -verify signPdf/app/build/outputs/bundle/release/SignPDF-release.aab

      - name: Lint release
        run: |
          if ! gradle -p signPdf :app:lintRelease; then
            echo "===== SignPDF lint report ====="
            cat signPdf/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SignPDF-v1.6.2-debug-apk
          path: signPdf/app/build/outputs/apk/debug/SignPDF-debug.apk
          retention-days: 7

      - name: Upload signed Play AAB
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SignPDF-v1.6.2-play-aab
          path: signPdf/app/build/outputs/bundle/release/SignPDF-release.aab
          retention-days: 7

      - name: Upload unsigned verification AAB
        if: steps.release_signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SignPDF-v1.6.2-unsigned-aab
          path: signPdf/app/build/outputs/bundle/release/SignPDF-release.aab
          retention-days: 7
