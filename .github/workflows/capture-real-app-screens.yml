name: Capture Real App Screens

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/capture-real-app-screens.yml'

permissions:
  contents: read

concurrency:
  group: real-app-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: whereisit
            label: WhereIsIt
            source: whereIsIt
            gradle: '8.7'
            app_id: com.whereisit.app
          - slug: ireumgil
            label: IreumGil
            source: ireumGil
            gradle: '8.7'
            app_id: com.ireumgil
          - slug: signpdf
            label: SignPDF
            source: signPdf
            gradle: '9.5.0'
            app_id: com.easternwood.signpdf
          - slug: dolbomon
            label: DolbomOn
            source: __restore_dolbomon__
            gradle: '9.5.0'
            app_id: com.easternwood.dolbomon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Select project source
        if: matrix.slug != 'dolbomon'
        shell: bash
        run: echo "PROJECT_DIR=$GITHUB_WORKSPACE/${{ matrix.source }}" >> "$GITHUB_ENV"

      - name: Restore DolbomOn source
        if: matrix.slug == 'dolbomon'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolbomon-src"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          cat dolbomon/source.tar.gz.b64.part-* | base64 -d | tar -xz -C "$SRC"
          echo 'android.sourceset.disallowProvider=false' >> "$SRC/gradle.properties"
          for spec in \
            'v0.2.0-commercial:p2' \
            'v0.2.1-settings:p3' \
            'v0.2.2-korean-records:p2' \
            'v0.2.3-ui-fixes:p2' \
            'v0.3.0-redesign:p1' \
            'v0.3.1b-final-ui:p1' \
            'v0.3.2-record-ux:p1'; do
            name=${spec%%:*}
            strip=${spec##*:}
            cat dolbomon/patches/${name}.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/${name}.patch"
            (cd "$SRC" && patch -${strip} < "$RUNNER_TEMP/${name}.patch")
          done
          cat dolbomon/patches/v0.3.3-stability-ui.patch.gz.b64.part-* | base64 -d | gzip -d > "$RUNNER_TEMP/v033.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033.patch")
          base64 -d dolbomon/patches/v0.3.3-scrollbar-crashfix.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v033-scroll.patch"
          (cd "$SRC" && patch -p1 < "$RUNNER_TEMP/v033-scroll.patch")
          echo "PROJECT_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Apply capture-only compatibility fixes
        if: matrix.slug == 'whereisit' || matrix.slug == 'ireumgil'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.slug }}" = "whereisit" ]; then
            sed -i 's/app:textColor=/android:textColor=/g' "$PROJECT_DIR/app/src/main/res/layout/activity_main.xml"
          fi
          if [ "${{ matrix.slug }}" = "ireumgil" ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('ireumGil/app/src/main/java/com/ireumgil/ui/HanjaSearchDialog.java')
          s = p.read_text()
          s = s.replace('private final HanjaRepository repository = new HanjaRepository();',
                        'private HanjaRepository repository;')
          s = s.replace('public Dialog onCreateDialog(@Nullable Bundle savedInstanceState) {\n        View v =',
                        'public Dialog onCreateDialog(@Nullable Bundle savedInstanceState) {\n        repository = new HanjaRepository(requireContext());\n        View v =')
          p.write_text(s)
          PY
          fi

      - name: Build real debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Using $APK_PATH"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and capture actual runtime screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            OUT="$GITHUB_WORKSPACE/real-app-screens/${{ matrix.slug }}"
            mkdir -p "$OUT"
            adb wait-for-device
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put system font_scale 1.0
            adb install -r "$APK_PATH"
            adb logcat -c
            adb shell monkey -p "${{ matrix.app_id }}" -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml "$OUT/window.xml" || true
            adb exec-out screencap -p > "$OUT/01-home-full.png"
            sleep 5
            adb exec-out screencap -p > "$OUT/02-home-settled.png"
            adb shell dumpsys window > "$OUT/window-dump.txt"
            adb shell dumpsys activity activities > "$OUT/activity-dump.txt"
            adb logcat -d > "$OUT/logcat.txt"
            printf 'app=%s\npackage=%s\napk=%s\napi=35\nprofile=pixel_6\nresolution=1080x2400\n' \
              '${{ matrix.label }}' '${{ matrix.app_id }}' "$APK_PATH" > "$OUT/capture-metadata.txt"

      - name: Upload actual emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-emulator-screen-${{ matrix.slug }}
          path: real-app-screens/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 14
