name: Capture Seven App Feature Scenarios

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/capture-feature-scenarios.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: seven-app-feature-scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-capture-runner:
    name: Build scenario automation runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate fictional sample documents
        run: |
          python3 -m pip install --disable-pip-version-check pillow reportlab
          python3 .github/capture-runner/generate_assets.py

      - name: Build UI automation APKs
        run: |
          gradle -p .github/capture-runner \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            --stacktrace

      - name: Prepare runner bundle
        run: |
          mkdir -p runner-bundle/generated-assets
          cp .github/capture-runner/app/build/outputs/apk/debug/app-debug.apk runner-bundle/capture-runner-debug.apk
          cp .github/capture-runner/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk runner-bundle/capture-runner-debug-androidTest.apk
          cp .github/capture-runner/generated-assets/* runner-bundle/generated-assets/

      - name: Upload runner bundle
        uses: actions/upload-artifact@v4
        with:
          name: capture-runner-bundle
          path: runner-bundle/
          retention-days: 7

  capture:
    name: Capture ${{ matrix.label }} feature flow
    needs: build-capture-runner
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: nfc
            label: NFC Reader
          - slug: signpdf
            label: SignPDF
          - slug: whereisit
            label: WhereIsIt
          - slug: dolbomon
            label: DolbomOn
          - slug: veilpic
            label: VeilPic
          - slug: ireumon
            label: IreumOn
          - slug: jamon
            label: JamOn
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter for projects that require it
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android SDK platforms
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'platforms;android-35' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'build-tools;36.0.0' >/dev/null

      - name: Download scenario runner
        uses: actions/download-artifact@v4
        with:
          name: capture-runner-bundle
          path: runner-bundle

      - name: Discover source and build actual APK
        shell: bash
        run: |
          chmod +x .github/capture-runner/find-and-build.sh
          .github/capture-runner/find-and-build.sh '${{ matrix.slug }}'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run seeded feature scenario on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/capture-runner/run-scenario.sh" '${{ matrix.slug }}' "$TARGET_PACKAGE" "$APK_PATH" "$GITHUB_WORKSPACE/runner-bundle" "$GITHUB_WORKSPACE/runner-bundle/generated-assets"

      - name: Upload actual feature screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-scenario-${{ matrix.slug }}
          path: feature-scenario-screens/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build and discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-build-${{ matrix.slug }}
          path: feature-capture-build/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 7

  assemble-preview:
    name: Assemble seven-app comparison
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all scenario screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: feature-scenario-*
          path: all-scenarios
          merge-multiple: false

      - name: Build comparison sheet and ZIP
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import zipfile

          root=Path('all-scenarios')
          out=Path('seven-app-output')
          out.mkdir(exist_ok=True)
          apps=[
              ('nfc','NFC Reader'),('signpdf','SignPDF'),('whereisit','WhereIsIt'),
              ('dolbomon','DolbomOn'),('veilpic','VeilPic'),('ireumon','IreumOn'),('jamon','JamOn')
          ]
          try:
              title_font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',38)
              label_font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',28)
          except OSError:
              title_font=label_font=ImageFont.load_default()

          cards=[]
          for slug,label in apps:
              folder=root/f'feature-scenario-{slug}'
              candidates=[]
              if folder.exists():
                  candidates=list(folder.rglob('*.png'))
              def rank(p):
                  n=p.name.lower()
                  return (
                      0 if 'feature' in n else 1 if n.startswith('99-') else 2 if 'settled' in n else 3,
                      1 if n.startswith('zz-') else 0,
                      n
                  )
              candidates=[p for p in candidates if p.stat().st_size>10000]
              candidates.sort(key=rank)
              if candidates:
                  im=Image.open(candidates[0]).convert('RGB')
              else:
                  im=Image.new('RGB',(1080,2400),'white')
                  d=ImageDraw.Draw(im)
                  d.text((90,1100),f'{label}\nNo completed capture',fill='black',font=title_font)
              target_h=690
              scale=target_h/im.height
              resized=im.resize((int(im.width*scale),target_h))
              card=Image.new('RGB',(420,790),'white')
              x=(420-resized.width)//2
              card.paste(resized,(x,72))
              d=ImageDraw.Draw(card)
              d.text((22,18),label,fill=(11,26,66),font=label_font)
              cards.append(card)

          sheet=Image.new('RGB',(1320,1710),(247,248,252))
          d=ImageDraw.Draw(sheet)
          d.text((42,30),'Eastern Wood Studio · Actual Feature Scenarios',fill=(11,26,66),font=title_font)
          for i,card in enumerate(cards):
              col=i%3; row=i//3
              sheet.paste(card,(30+col*430,105+row*800))
          sheet.save(out/'seven-app-feature-scenarios.png',quality=95)

          with zipfile.ZipFile(out/'seven-app-feature-scenarios.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(root))
          PY

      - name: Upload final comparison package
        uses: actions/upload-artifact@v4
        with:
          name: seven-app-feature-scenarios
          path: seven-app-output/
          retention-days: 14
