name: Cleanup Actions Storage

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/cleanup-actions-storage.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const KEEP_PER_NAME = 3;
            const artifacts = [];
            for (let page = 1; ; page++) {
              const res = await github.rest.actions.listArtifactsForRepo({ owner, repo, per_page: 100, page });
              artifacts.push(...res.data.artifacts);
              if (res.data.artifacts.length < 100) break;
            }

            const groups = new Map();
            for (const artifact of artifacts.filter(a => !a.expired)) {
              if (!groups.has(artifact.name)) groups.set(artifact.name, []);
              groups.get(artifact.name).push(artifact);
            }

            let deleted = 0;
            let freed = 0;
            for (const [name, items] of groups.entries()) {
              items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const artifact of items.slice(KEEP_PER_NAME)) {
                core.info(`Deleting artifact ${name} id=${artifact.id} size=${artifact.size_in_bytes} created=${artifact.created_at}`);
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                deleted++;
                freed += artifact.size_in_bytes || 0;
              }
            }
            core.info(`Deleted ${deleted} old artifacts; approx freed ${(freed / 1024 / 1024).toFixed(1)} MiB. Kept newest ${KEEP_PER_NAME} per artifact name.`);

      - name: Delete stale Actions caches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const caches = [];
            for (let page = 1; ; page++) {
              const res = await github.rest.actions.getActionsCacheList({ owner, repo, per_page: 100, page });
              const pageCaches = res.data.actions_caches || [];
              caches.push(...pageCaches);
              if (pageCaches.length < 100) break;
            }

            let deleted = 0;
            let freed = 0;
            for (const cache of caches) {
              const lastUsed = new Date(cache.last_accessed_at || cache.created_at).getTime();
              if (lastUsed < cutoff) {
                core.info(`Deleting cache id=${cache.id} key=${cache.key} size=${cache.size_in_bytes}`);
                await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
                deleted++;
                freed += cache.size_in_bytes || 0;
              }
            }
            core.info(`Deleted ${deleted} stale caches; approx freed ${(freed / 1024 / 1024).toFixed(1)} MiB.`);
